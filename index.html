<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Funciones</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>

    <main class="contenedor">
        <h1 class="titulo">CLASIFICADOR DE FUNCIONES: f(x) = bx + c</h1>

        <div class="fila">
            <strong>b</strong> = [ <span id="b">0</span> ]
        </div>

        <div class="fila">
            <strong>c</strong> = [ <span id="c">0</span> ]
        </div>

        <button id="boton" type="button">[ Generar / Cambiar ]</button>

        <section id="lineal" class="caja">
            <h2>LINEAL</h2>
            <p class="texto">Cuando c es 0 y b no es 0: pasa por el (0, 0).</p>
            <ul id="listalineal"></ul>
        </section>

        <section id="afin" class="caja">
            <h2>AFÍN / CONSTANTE</h2>
            <p class="texto">Cuando c no es 0: si b es 0 queda constante, si no es afín.</p>
            <ul id="listaafin"></ul>
        </section>

        <section id="nula" class="caja">
            <h2>SIN FUNCIÓN</h2>
            <p class="texto">Cuando b es 0 y c es 0: no hay función.</p>
            <ul id="listanula"></ul>
        </section>

        <hr class="linea">

        <section class="grafico">
            <h2>GRÁFICO EN GEOGEBRA</h2>
            <div id="ggb"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
